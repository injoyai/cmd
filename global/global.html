<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配置 · i</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f8; --surface: #ffffff; --text: #172033; --muted: #5c687b;
  --border: #dce2e8; --accent: #0c6b62; --accent-hover: #09574f;
  --accent-soft: #eaf5f2; --danger: #b42318; --radius: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--border) var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
button:active:not(:disabled) { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
header { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--border); }
.toolbar, main { max-width: 820px; margin: auto; padding: 16px 24px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: 19px; }
h2 { margin: 0 0 16px; font-size: 15px; }
button { padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); }
button:hover:not(:disabled) { background: var(--bg); }
.primary { width: 112px; background: var(--accent); border-color: var(--accent); color: var(--surface); }
.primary:hover:not(:disabled) { background: var(--accent-hover); }
.save-status { min-height: 24px; margin: 0 0 12px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
[data-tone="error"], .field-error { color: var(--danger); }
[data-tone="success"] { color: var(--accent); }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
.section { margin-bottom: 16px; padding: 20px 24px 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.field { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.field-label { padding-top: 7px; }
.editor, .shortcut-row > div { min-width: 0; }
.text-input { width: 100%; min-width: 0; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); background: var(--surface); }
.text-input:focus { border-color: var(--accent); outline-color: var(--accent-soft); }
.text-input[aria-invalid="true"] { border-color: var(--danger); }
textarea { display: block; min-height: 100px; resize: none; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; cursor: pointer; }
.toggle input { accent-color: var(--accent); }
.secret { display: flex; gap: 8px; }
.icon-button { display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 0; flex-shrink: 0; }
.icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.hint, .empty, .field-error { margin: 6px 0 0; font-size: 12px; }
.hint, .empty { color: var(--muted); }
.object-tools { margin-bottom: 10px; }
.shortcut-row { display: grid; grid-template-columns: minmax(80px, .7fr) minmax(0, 1.3fr) auto; gap: 8px; margin-bottom: 10px; }
.text-button { color: var(--muted); }
.text-button:hover { color: var(--danger); }
@media (max-width: 580px) {
  .toolbar, main { padding: 12px 16px; }
  .section { padding: 16px 16px 0; }
  .field { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .field-label { padding: 0; }
  .shortcut-row { grid-template-columns: minmax(0, 1fr) auto; }
  .shortcut-target { grid-column: 1; }
  .shortcut-row button { grid-column: 2; grid-row: 1 / 3; }
}
</style>
</head>
<body>
<header><div class="toolbar">
  <h1>配置</h1>
  <button id="saveButton" class="primary" type="submit" form="configForm" disabled>保存配置</button>
</div></header>
<main>
  <p id="saveStatus" class="save-status" role="status" aria-live="polite">正在读取配置…</p>
  <form id="configForm" novalidate><fieldset id="configFields" disabled aria-label="配置项"></fieldset></form>
</main>
<script>
const form = document.getElementById("configForm");
const fieldset = document.getElementById("configFields");
const saveButton = document.getElementById("saveButton");
const status = document.getElementById("saveStatus");
const groups = { download: "下载", proxy: "代理", resource: "资源地址", upload: "MinIO 上传", open: "快捷打开" };
const hints = { "proxy.addr": "留空时使用系统代理环境变量。", "proxy.ignore": "逗号分隔的正则规则；匹配的资源不使用代理。", "resource.urls": "每行一个地址，按顺序尝试。留空时使用内置资源地址。" };
let configs = [], controls = new Map(), loaded = false, dirty = false, saving = false, rowID = 0;

function el(tag, className, text) {
  const node = document.createElement(tag);
  node.className = className || "";
  if (text !== undefined) node.textContent = text;
  return node;
}
function setIcon(button, name, label) {
  const paths = {
    eye: "M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0",
    hidden: "m3 3 18 18M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z",
    plus: "M12 5v14M5 12h14",
    trash: "M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"
  };
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const path = document.createElementNS(svg.namespaceURI, "path");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  path.setAttribute("d", paths[name]);
  svg.appendChild(path);
  button.replaceChildren(svg);
  button.setAttribute("aria-label", label);
  button.setAttribute("title", label);
}
function action(icon, label, className, run) {
  const button = el("button", "icon-button " + className);
  button.type = "button";
  setIcon(button, icon, label);
  button.addEventListener("click", run);
  return button;
}
function showStatus(message, tone) {
  status.textContent = message;
  status.dataset.tone = tone || "";
}
function markDirty() {
  if (!loaded || saving) return;
  dirty = true;
  saveButton.disabled = false;
  showStatus("有未保存的修改");
}
function inputField(id, value, type) {
  const input = el("input", "text-input");
  input.id = id;
  input.type = type || "text";
  input.value = value == null ? "" : value;
  input.spellcheck = false;
  input.autocomplete = type === "password" ? "new-password" : "off";
  return input;
}
function addShortcut(container, key, value, focus) {
  const row = el("div", "shortcut-row"), nameBox = el("div"), targetBox = el("div", "shortcut-target");
  const name = inputField("shortcut-name-" + (++rowID), key);
  name.classList.add("shortcut-name");
  name.placeholder = "快捷名称";
  name.setAttribute("aria-label", "快捷名称");
  const error = el("p", "field-error");
  error.id = name.id + "-error";
  error.hidden = true;
  name.setAttribute("aria-describedby", error.id);
  name.addEventListener("input", () => { name.removeAttribute("aria-invalid"); error.hidden = true; });
  nameBox.append(name, error);
  const target = inputField("shortcut-target-" + rowID, value);
  target.classList.add("shortcut-value");
  target.placeholder = "文件、目录或程序路径";
  target.setAttribute("aria-label", "打开目标");
  targetBox.appendChild(target);
  const remove = action("trash", "移除此快捷方式", "text-button", () => {
    const next = row.nextElementSibling || row.previousElementSibling;
    row.remove();
    container.querySelector(".empty").hidden = container.querySelectorAll(".shortcut-row").length > 0;
    (next ? next.querySelector("input") : container.querySelector(".add-shortcut")).focus();
    markDirty();
  });
  row.append(nameBox, targetBox, remove);
  container.querySelector(".shortcut-rows").appendChild(row);
  container.querySelector(".empty").hidden = true;
  if (focus) name.focus();
}
function renderField(config) {
  const row = el("div", "field"), caption = el("div", "field-label"), editor = el("div", "editor");
  const label = el("label", "", config.name);
  label.id = "label-" + config.key;
  label.htmlFor = config.key;
  caption.appendChild(label);
  let control;
  if (config.type === "object") {
    control = el("div");
    const tools = el("div", "object-tools");
    const add = action("plus", "添加快捷方式", "add-shortcut", () => { addShortcut(control, "", "", true); markDirty(); });
    add.id = config.key;
    tools.appendChild(add);
    control.append(tools, el("div", "shortcut-rows"), el("p", "empty", "还没有快捷方式。"));
    (config.value || []).forEach(item => addShortcut(control, item.key, item.value, false));
  } else if (config.type === "bool") {
    control = el("input");
    control.id = config.key;
    control.type = "checkbox";
    control.checked = !!config.value;
    control.setAttribute("aria-labelledby", label.id);
    const toggle = el("label", "toggle");
    toggle.append(control, el("span", "", "启用"));
    editor.appendChild(toggle);
  } else if (config.type === "list") {
    control = el("textarea", "text-input");
    control.id = config.key;
    control.value = (config.value || []).join("\n");
    control.spellcheck = false;
    control.addEventListener("input", () => { control.style.height = "auto"; control.style.height = Math.max(100, control.scrollHeight) + "px"; });
  } else {
    control = inputField(config.key, config.value, config.type === "secret" ? "password" : "text");
    if (config.type === "secret") {
      const secret = el("div", "secret");
      const reveal = action("eye", "显示 " + config.name, "secondary", () => {
        const visible = control.type === "password";
        control.type = visible ? "text" : "password";
        setIcon(reveal, visible ? "hidden" : "eye", (visible ? "隐藏 " : "显示 ") + config.name);
        reveal.setAttribute("aria-pressed", String(visible));
      });
      reveal.setAttribute("aria-pressed", "false");
      secret.append(control, reveal);
      editor.appendChild(secret);
    }
  }
  if (!editor.children.length) editor.appendChild(control);
  if (hints[config.key]) {
    const hint = el("p", "hint", hints[config.key]);
    hint.id = "hint-" + config.key;
    control.setAttribute("aria-describedby", hint.id);
    editor.appendChild(hint);
  }
  controls.set(config.key, control);
  row.append(caption, editor);
  return row;
}
function loadConfig(values) {
  configs = values;
  controls = new Map();
  fieldset.replaceChildren();
  for (const [key, title] of Object.entries(groups)) {
    const section = el("section", "section");
    const heading = el("h2", "", title);
    heading.id = "heading-" + key;
    section.setAttribute("aria-labelledby", heading.id);
    section.appendChild(heading);
    configs.filter(config => config.key.split(".")[0] === key).forEach(config => section.appendChild(renderField(config)));
    fieldset.appendChild(section);
  }
  loaded = true;
  dirty = saving = false;
  fieldset.disabled = false;
  saveButton.disabled = true;
  showStatus("已载入配置");
}
function collectConfig() {
  const result = Object.create(null);
  for (const config of configs) {
    const control = controls.get(config.key);
    if (config.type === "object") {
      const values = Object.create(null);
      for (const row of control.querySelectorAll(".shortcut-row")) {
        const name = row.querySelector(".shortcut-name"), value = row.querySelector(".shortcut-value").value;
        const error = row.querySelector(".field-error");
        name.removeAttribute("aria-invalid");
        error.hidden = true;
        if (name.value === "" && value === "") continue;
        if (!name.value.trim() || Object.prototype.hasOwnProperty.call(values, name.value)) {
          error.textContent = !name.value.trim() ? "请填写快捷名称。" : "名称重复，请使用不同名称。";
          error.hidden = false;
          name.setAttribute("aria-invalid", "true");
          name.focus();
          return null;
        }
        values[name.value] = value;
      }
      result[config.key] = values;
    } else if (config.type === "bool") result[config.key] = control.checked;
    else if (config.type === "list") result[config.key] = control.value.split(/\r?\n/).filter(line => line.trim());
    else result[config.key] = control.value;
  }
  return result;
}
async function saveConfig() {
  if (!loaded || !dirty || saving) return;
  const values = collectConfig();
  if (!values) { showStatus("请检查快捷方式的名称。", "error"); return; }
  saving = true;
  fieldset.disabled = saveButton.disabled = true;
  saveButton.textContent = "保存中…";
  form.setAttribute("aria-busy", "true");
  showStatus("正在保存配置…");
  try {
    await window.saveToFile(values);
    dirty = false;
    showStatus("已保存", "success");
  } catch (error) {
    showStatus("保存失败：" + (error && error.message ? error.message : String(error)), "error");
  } finally {
    saving = false;
    fieldset.disabled = false;
    saveButton.disabled = !dirty;
    saveButton.textContent = "保存配置";
    form.removeAttribute("aria-busy");
  }
}
form.addEventListener("input", markDirty);
form.addEventListener("change", markDirty);
form.addEventListener("submit", event => { event.preventDefault(); saveConfig(); });
</script>
</body>
</html>
